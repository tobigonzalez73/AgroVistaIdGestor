<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/agrovistaimagen.jpg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroTrials v2.5 - LIVE v1.7.5</title>
    <script>
      // Force refresh on new version
      const VERSION = '1.7.5';
      if (localStorage.getItem('app_version') !== VERSION) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) { registration.unregister(); }
          });
        }
        caches.keys().then(names => {
          for (let name of names) caches.delete(name);
        });
        localStorage.setItem('app_version', VERSION);
        console.log('App updated to ' + VERSION + '. Reloading...');
        setTimeout(() => window.location.reload(true), 500);
      }
    </script>


  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
